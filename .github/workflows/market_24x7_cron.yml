name: 24/7 Autonomous Market Engine & Signal Tracker

on:
  schedule:
    # Every 15 minutes during Indian Market Hours (Mon-Fri 03:45 UTC to 10:15 UTC -> 9:15 AM to 3:45 PM IST)
    - cron: '*/15 3-10 * * 1-5'
    # Daily EOD Sync at 10:45 UTC (4:15 PM IST)
    - cron: '45 10 * * 1-5'
    # Off-market / weekend check once daily
    - cron: '0 6 * * 0,6'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  market-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: 🚀 Run Autonomous Cloud Market Engine
        run: |
          python backend/cloud_market_engine.py

      - name: 💾 Commit & Push Updated Market Data
        run: |
          git config --global user.name "MarketRadar-Bot"
          git add database/*.json
          git add backend/*.json
          git add flutter_app/assets/*.json
          git add dashboards/*.html
          git commit -m "🤖 24/7 Cloud Sync: Live Quotes, Radar Signals & News [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or branch up to date"
